[package]
name = "octopus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "octopus"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:octopus-desktop"]
release = []

[dependencies]
octopus-proto.workspace = true
octopus-server.workspace = true
octopus-client.workspace = true
octopus-desktop = { workspace = true, optional = true }
clap = { version = "4.6.7", features = ["derive", "string"] }
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
anyhow.workspace = true
crossterm = "0.29.0"
dirs.workspace = true
serde.workspace = true
nix = { workspace = true, features = ["fs", "user"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2.189"
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
tempfile.workspace = true

[dev-dependencies]
futures = "0.3.34"
iroh.workspace = true
iroh-relay.workspace = true
tempfile.workspace = true
