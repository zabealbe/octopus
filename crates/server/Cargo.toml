portable-pty = "0.9.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
trash = "5.2.9"
which = "8.0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
