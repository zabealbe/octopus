name: release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
    inputs:
      sha:
        description: The release commit to build again
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'warm' || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  DESKTOP_BUNDLE_CONFIG: '{"mainBinaryName":"octopus"}'

jobs:
  version:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.commit.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
      notes: ${{ steps.commit.outputs.notes }}
    steps:
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA")
          message=$(jq -r .commit.message <<<"$commit")
          title=$(head -n 1 <<<"$message")
          release='^release: v([0-9]+\.[0-9]+\.[0-9]+)$'
          if [[ ! $title =~ $release ]]; then
            echo "not a release commit: $title"
            exit 0
          fi
          delimiter=$(openssl rand -hex 16)
          {
            echo "version=${BASH_REMATCH[1]}"
            echo "sha=$(jq -r .sha <<<"$commit")"
            echo "notes<<$delimiter"
            tail -n +3 <<<"$message"
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - if: steps.commit.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - name: Check the release commit's Cargo.toml carries its version
        if: steps.commit.outputs.version != ''
        env:
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          carried=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "octopus-cli") | .version')
          if [[ $carried != "$VERSION" ]]; then
            echo "the release commit names v$VERSION, but its Cargo.toml carries $carried" >&2
            exit 1
          fi

  macos:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - run: |
          MACOSX_DEPLOYMENT_TARGET=$(jq -r .bundle.macOS.minimumSystemVersion crates/desktop/tauri.conf.json)
          export MACOSX_DEPLOYMENT_TARGET
          cargo build --release --locked -p octopus-cli --features release --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/octopus
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          webkit: true
      - name: Build the headless CLI, then the app, carrying the headless build inside the AppImage for the server's copy
        run: |
          cargo build --release --locked -p octopus-cli -p octopus-desktop --no-default-features --target "$BUILD_TARGET"
          headless="$RUNNER_TEMP/headless"
          mkdir -p dist "$headless"
          cp "target/$BUILD_TARGET/release/octopus" "$headless/octopus"
          tar -czf "dist/octopus-cli_${VERSION}_${BUILD_TARGET}.tar.gz" -C "$headless" octopus
          cargo build --release --locked -p octopus-cli --features release --target "$BUILD_TARGET"
          config=$(jq -c --arg headless "$headless/octopus" \
            '.bundle.linux.appimage.files["/usr/lib/octopus/octopus"] = $headless' <<<"$DESKTOP_BUNDLE_CONFIG")
          (cd crates/desktop && cargo tauri bundle --bundles appimage --target "$BUILD_TARGET" --config "$config")
          cp target/"$BUILD_TARGET"/release/bundle/appimage/*.AppImage "dist/octopus_${VERSION}_${ARCH}.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  android:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            triple: aarch64-linux-android
            arch: arm64
          - target: armv7
            triple: armv7-linux-androideabi
            arch: arm
          - target: i686
            triple: i686-linux-android
            arch: x86
          - target: x86_64
            triple: x86_64-linux-android
            arch: x86_64
    env:
      BUILD_TARGET: ${{ matrix.target }}
      GRADLE_CACHE: |
        ~/.gradle/caches
        ~/.gradle/wrapper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - id: gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: gradle-${{ hashFiles('crates/mobile/gen/android/**/*.gradle*', 'crates/mobile/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.triple }}
      - working-directory: crates/mobile
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo tauri android build --apk --split-per-abi --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.arch }}
          path: crates/mobile/gen/android/app/build/outputs/apk/${{ matrix.arch }}/release/app-${{ matrix.arch }}-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - if: github.event_name == 'schedule' && matrix.target == 'aarch64' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: ${{ steps.gradle.outputs.cache-primary-key }}

  macos-dmg:
    needs: [version, macos]
    if: needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    outputs:
      notary-id: ${{ steps.submit.outputs.id }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: ${{ runner.temp }}/macos
      - run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/octopus \
            "$RUNNER_TEMP/macos/macos-aarch64-apple-darwin/octopus" "$RUNNER_TEMP/macos/macos-x86_64-apple-darwin/octopus"
          chmod +x target/universal-apple-darwin/release/octopus
      - name: Bundle and sign the app and its dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          (cd crates/desktop && cargo tauri bundle --bundles app,dmg --target universal-apple-darwin --config "$DESKTOP_BUNDLE_CONFIG")
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/octopus_${VERSION}_universal.dmg"
          COPYFILE_DISABLE=1 tar -czf "dist/octopus_${VERSION}_universal.app.tar.gz" -C target/universal-apple-darwin/release/bundle/macos octopus.app
      - name: Submit the dmg to Apple's notary
        id: submit
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$APPLE_API_KEY" >"$key"
          unset APPLE_API_KEY
          xcrun notarytool submit "dist/octopus_${VERSION}_universal.dmg" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json |
            jq -er '"id=\(.id)"' | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  android-apk:
    needs: [version, android]
    if: needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-*
          path: ${{ runner.temp }}/apks
      - name: Merge the per-ABI apks into the universal apk
        run: |
          cd "$RUNNER_TEMP/apks"
          cp android-arm64/app-arm64-release-unsigned.apk universal.apk
          for arch in arm x86 x86_64; do
            unzip -q "android-$arch/app-$arch-release-unsigned.apk" 'lib/*' -d libs
          done
          (cd libs && zip -q -0 -r -D -X ../universal.apk lib)
      - name: Align and sign the apk
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)"
          "$build_tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/apks/universal.apk" "$RUNNER_TEMP/apks/aligned.apk"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          base64 --decode <<<"$ANDROID_KEYSTORE" >"$keystore"
          mkdir dist
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "dist/octopus_${VERSION}.apk" "$RUNNER_TEMP/apks/aligned.apk"
          "$build_tools/apksigner" verify "dist/octopus_${VERSION}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: [version, linux, macos-dmg, android-apk]
    if: needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSETS: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
      DMG: octopus_${{ needs.version.outputs.version }}_universal.dmg
      APP_ARCHIVE: octopus_${{ needs.version.outputs.version }}_universal.app.tar.gz
      LINUX_APP: octopus_${{ needs.version.outputs.version }}_amd64.AppImage
      ARM_LINUX_APP: octopus_${{ needs.version.outputs.version }}_arm64.AppImage
      APK: octopus_${{ needs.version.outputs.version }}.apk
      CLI_X86_64: octopus-cli_${{ needs.version.outputs.version }}_x86_64-unknown-linux-gnu.tar.gz
      CLI_AARCH64: octopus-cli_${{ needs.version.outputs.version }}_aarch64-unknown-linux-gnu.tar.gz
      SIGNATURES: signatures
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - name: Check every asset arrived, and install the tauri CLI and minisign before any secret is in reach
        run: |
          (cd dist && ls -- "$DMG" "$APP_ARCHIVE" "$LINUX_APP" "$ARM_LINUX_APP" "$APK" "$CLI_X86_64" "$CLI_AARCH64" >/dev/null)
          bun install --cwd source/ui --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Sign the app updates for this version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir "$SIGNATURES"
          for update in "$APP_ARCHIVE" "$LINUX_APP" "$ARM_LINUX_APP"; do
            source/ui/node_modules/.bin/tauri signer sign --app-version "$VERSION" "dist/$update" >/dev/null
            mv "dist/$update.sig" "$SIGNATURES/"
          done
      - name: Check each signature against the public key the app ships, then write the updater's latest.json
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          jq -r .plugins.updater.pubkey source/crates/desktop/tauri.conf.json | base64 --decode >"$RUNNER_TEMP/updater.pub"
          for update in "$APP_ARCHIVE" "$LINUX_APP" "$ARM_LINUX_APP"; do
            base64 --decode <"$SIGNATURES/$update.sig" >"$SIGNATURES/$update.minisig"
            minisign -V -q -p "$RUNNER_TEMP/updater.pub" -m "dist/$update" -x "$SIGNATURES/$update.minisig"
          done
          platform() {
            jq -n --arg platform "$1" --arg url "$ASSETS/$2" --rawfile signature "$SIGNATURES/$2.sig" \
              '{($platform): {url: $url, signature: $signature}}'
          }
          {
            platform darwin-aarch64 "$APP_ARCHIVE"
            platform darwin-x86_64 "$APP_ARCHIVE"
            platform linux-x86_64 "$LINUX_APP"
            platform linux-aarch64 "$ARM_LINUX_APP"
          } | jq -s --arg version "$VERSION" --arg notes "$NOTES" \
            '{version: $version, notes: $notes, pub_date: (now | todate), platforms: add}' >dist/latest.json
      - name: Write the release body, download buttons first
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          button() {
            label=$(jq -rn --arg label "$1" '$label | @uri')
            printf '[![%s](https://img.shields.io/badge/%s-%s?style=for-the-badge&logo=%s&logoColor=white)](%s/%s)' \
              "$1" "$label" "$2" "$3" "$ASSETS" "$4"
          }
          {
            button macOS 000000 apple "$DMG"
            printf ' '
            button Linux E95420 linux "$LINUX_APP"
            printf ' '
            button Android 34A853 android "$APK"
            printf '\n\n'
            echo "Linux on Arm: [AppImage]($ASSETS/$ARM_LINUX_APP) · Servers without a screen: [CLI for x86_64]($ASSETS/$CLI_X86_64), [CLI for aarch64]($ASSETS/$CLI_AARCH64)"
            echo
            printf '%s\n' "$NOTES"
          } >"$RUNNER_TEMP/body.md"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          if draft=$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::v$VERSION is already published"
              exit 1
            fi
            gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/body.md"
          else
            gh release create "v$VERSION" --draft --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/body.md"
          fi
          cd dist
          gh release upload "v$VERSION" ./* --clobber
          gh release view "v$VERSION" --json assets -q '.assets[].name' | while read -r name; do
            [ -e "$name" ] || gh release delete-asset "v$VERSION" "$name" --yes
          done

  publish:
    needs: [version, macos-dmg, draft]
    if: needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 350
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      ID: ${{ needs.macos-dmg.outputs.notary-id }}
    steps:
      - name: Wait for Apple to accept the dmg, then staple it
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$APPLE_API_KEY" >"$key"
          unset APPLE_API_KEY
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          xcrun notarytool wait "$ID" "${auth[@]}" --timeout 330m || true
          status=$(xcrun notarytool info "$ID" "${auth[@]}" --output-format json | jq -er .status)
          case $status in
            Accepted) ;;
            "In Progress")
              echo "::error::Apple has not decided notary submission $ID; re-run this job once it does"
              exit 1
              ;;
            *)
              xcrun notarytool log "$ID" "${auth[@]}"
              echo "::error::notary submission $ID is $status"
              exit 1
              ;;
          esac
          gh release download "v$VERSION" -p 'octopus*' -D dist
          xcrun stapler staple "dist/octopus_${VERSION}_universal.dmg"
          xcrun stapler validate "dist/octopus_${VERSION}_universal.dmg"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: |
          cd dist
          shasum -a 256 octopus* >SHA256SUMS
          gh release upload "v$VERSION" "octopus_${VERSION}_universal.dmg" SHA256SUMS --clobber
          gh release edit "v$VERSION" --draft=false --latest
