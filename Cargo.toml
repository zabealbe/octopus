[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
octopus-proto = { path = "crates/proto" }
octopus-server = { path = "crates/server" }
octopus-client = { path = "crates/client" }
octopus-shell = { path = "crates/shell" }
octopus-desktop = { path = "crates/desktop" }
# Exact: iroh parses untrusted traffic before octopus authenticates a peer, so a bump is a reviewed change. No
# portmapper, so no router is asked to open a port.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }
anyhow = "1.0.104"
base64 = "0.22.1"
block2 = "0.6.2"
dirs = "7.0.0"
nix = "0.31.3"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Stripping after the link would drop the signature scripts/link-signed gives.
[profile.release]
strip = false

# x86_64 verifies signatures on curve25519-dalek's AVX2 path, which unoptimized outweighs the work a test times.
[profile.dev.package.curve25519-dalek]
opt-level = 3
